# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#

# _bmad/config.toml's [core] never carries communication_language or
# user_skill_level (only document_output_language) even though
# _bmad/bmm/config.yaml declares both; scripts that read the central config
# chain (e.g. render_skill.py) only merge _bmad/config.toml + custom
# overrides, not bmm/config.yaml, and fail without these. Pinned here to
# match the already-confirmed bmm values.
[core]
communication_language = "Chinese"
user_skill_level = "intermediate"
