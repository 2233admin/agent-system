# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.
# Example: override an agent descriptor, or add a new agent.
#

# _bmad/config.toml's [core] never carries communication_language (only
# document_output_language) even though _bmad/bmm/config.yaml declares it as
# Chinese; scripts that read the central config chain (e.g. render_skill.py)
# fail without it. Pinned here to match the already-confirmed bmm value.
#
# Same gap for user_skill_level: only _bmad/bmm/config.yaml declares it
# ("intermediate"); the central [core] chain render_skill.py reads never
# carries it, so skill rendering HALTs with "missing config value
# `user_skill_level`". Pinned here to match the already-confirmed bmm value.
[core]
communication_language = "Chinese"
user_skill_level = "intermediate"
